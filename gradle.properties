org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# R8 내부에서 리소스 축소를 함께 수행(최적화된 리소스 축소).
# Play Console R8 권장사항 대응 — AGP 9 부터는 기본값이 될 예정.
android.r8.optimizedResourceShrinking=true

# AGP 9의 내장 Kotlin 지원은 아직 kapt/KSP 와 호환되지 않는다.
# 내장 Kotlin 과 새 DSL 을 끄고 기존 Kotlin Gradle 플러그인 + KSP 조합을 사용한다.
#
# ⚠️ 두 플래그 모두 AGP 10에서 제거된다(전환기용 임시 설정).
#    KSP 가 내장 Kotlin 을 지원하면 이 두 줄과 kotlin.android 플러그인을 제거하고
#    android { kotlin { compilerOptions {} } } 로 마이그레이션해야 한다.
android.builtInKotlin=false
android.newDsl=false
